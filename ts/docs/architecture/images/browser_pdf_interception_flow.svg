<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 620 360"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>PDF interception and viewer flow</title><desc>When the agent is connected, the content script&apos;s pdfInterceptor redirects a PDF link click to a custom typeagent-browser://pdfView URL, opening the PDF.js-based viewer that renders the document and supports highlights, annotations and knowledge extraction.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g><rect width="440" height="44" x="90" y="24" fill="#444441" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="310" y="46" fill="#D3D1C7" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">PDF link click</text></g><line x1="310" x2="310" y1="68" y2="92" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="80" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">pdfInterceptor.ts</text><g><rect width="440" height="44" x="90" y="92" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="310" y="114" fill="#CECBF6" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">Redirect to typeagent-browser://pdfView?url=&lt;encoded&gt;</text></g><line x1="310" x2="310" y1="136" y2="160" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="440" height="150" x="90" y="160" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="104" y="182" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">PDF viewer (pdfView.html)</text><text x="104" y="202" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">PDF.js rendering</text><text x="104" y="220" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Text selection -&gt; highlights</text><text x="104" y="238" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Annotation management</text><text x="104" y="256" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Knowledge extraction</text></g></svg>