<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 660 598"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>Search and answer generation pipeline</title><desc>A user query flows through the QueryAnalyzer, search strategies, MetadataRanker, ContextBuilder and AnswerGenerator stages to produce an ActionResult with a summary, source links and follow-up suggestions.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><line x1="330" x2="330" y1="74" y2="100" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" x2="330" y1="172" y2="198" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" x2="330" y1="252" y2="278" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" x2="330" y1="332" y2="358" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" x2="330" y1="412" y2="438" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="330" x2="330" y1="492" y2="518" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="580" height="54" x="40" y="20" fill="#444441" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="54" y="42" fill="#D3D1C7" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">User query</text><text x="54" y="62" fill="#B4B2A9" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">&quot;What did I read about climate change?&quot;</text></g><g><rect width="580" height="72" x="40" y="100" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="122" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">QueryAnalyzer (queryAnalyzer.mts)</text><text x="54" y="142" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Intent detection (find_latest, summarize, ...)</text><text x="54" y="160" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Query decomposition: entities, topics, temporal filters</text></g><g><rect width="580" height="54" x="40" y="198" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="220" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Search strategies (searchWebMemories.mts)</text><text x="54" y="240" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Keyword · Entity · Topic · Hybrid search</text></g><g><rect width="580" height="54" x="40" y="278" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="300" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">MetadataRanker (metadataRanker.mts)</text><text x="54" y="320" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Ranks by relevance, recency, quality</text></g><g><rect width="580" height="54" x="40" y="358" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="380" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">ContextBuilder (contextBuilder.mts)</text><text x="54" y="400" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Builds SearchContext: domains, time range, top topics</text></g><g><rect width="580" height="54" x="40" y="438" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="460" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">AnswerGenerator (answerGenerator.mts)</text><text x="54" y="480" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Single LLM call via TypeChat -&gt; AnswerEnhancement</text></g><g><rect width="580" height="54" x="40" y="518" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="54" y="540" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">ActionResult</text><text x="54" y="560" fill="#5DCAA5" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Summary + source links + follow-up suggestions</text></g></svg>