<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 660 240"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>WebFlow recording component layout</title><desc>The content script recording module captures DOM events and sends them to the browser agent&apos;s webFlows subsystem, which normalizes recordings and generates, validates, executes and registers scripts and grammar via the WebFlow store.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g><rect width="260" height="150" x="40" y="40" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="62" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Content script — recording/</text><text x="54" y="82" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">actions.ts</text><text x="54" y="100" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">capture.ts</text><text x="54" y="118" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">index.ts</text><text x="54" y="136" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">(captures DOM events)</text></g><g><rect width="260" height="150" x="360" y="40" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="374" y="62" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Browser agent — webFlows/</text><text x="374" y="82" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">recordingNormalizer</text><text x="374" y="100" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">scriptGenerator</text><text x="374" y="118" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">scriptValidator</text><text x="374" y="136" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">scriptExecutor</text><text x="374" y="154" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">grammarGenerator · webFlowStore</text></g><line x1="300" x2="360" y1="115" y2="115" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/></svg>