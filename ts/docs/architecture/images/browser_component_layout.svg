<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 780 600"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>Browser agent component layout</title><desc>The TypeAgent dispatcher hosts the browser agent, which connects over a channel-multiplexed WebSocket on port 8081 to two backends: the Chrome extension service worker with its content scripts and side panel UI, and the Electron shell main process with its WebContentsView tabs.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><rect width="700" height="150" x="40" y="20" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3" stroke-width=".8" rx="10"/><text x="52" y="38" fill="#D3D1C7" font-size="12" font-weight="600" text-anchor="start">TypeAgent Dispatcher (Node.js process)</text><g><rect width="640" height="110" x="70" y="44" fill="#444441" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="84" y="66" fill="#D3D1C7" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Browser Agent (browserActionHandler.mts)</text><text x="84" y="86" fill="#B4B2A9" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Action router: executeBrowserAction()</text><text x="84" y="104" fill="#B4B2A9" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">AgentWebSocketServer (port 8081) + ExternalBrowserClient</text><text x="84" y="122" fill="#B4B2A9" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Knowledge subsystem, WebFlow store, Discovery subsystem</text></g><line x1="390" x2="390" y1="170" y2="196" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="184" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">WebSocket :8081 · channel-multiplexed RPC</text><path fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" d="M390 196 L390 212 L200 212 L200 232"/><path fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" d="M390 196 L390 212 L580 212 L580 232"/><rect width="340" height="348" x="40" y="232" fill="none" stroke="#AFA9EC" stroke-dasharray="4 3" stroke-width=".8" rx="10"/><text x="52" y="250" fill="#CECBF6" font-size="12" font-weight="600" text-anchor="start">Chrome Extension (service worker process)</text><g><rect width="300" height="92" x="60" y="256" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="74" y="278" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Service worker</text><text x="74" y="298" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">WebSocket client / ExternalBrowserServer</text><text x="74" y="316" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">RPC handler pool (100+ handlers)</text><text x="74" y="334" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Tab &amp; recording manager</text></g><line x1="210" x2="210" y1="348" y2="372" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="300" height="110" x="60" y="372" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="74" y="394" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Content scripts (per-tab, per-frame)</text><text x="74" y="414" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">DOM interaction · Recording capture</text><text x="74" y="432" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Schema extraction · Auto-indexing</text><text x="74" y="450" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">WebAgent runtime</text></g><g><rect width="300" height="74" x="60" y="494" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="74" y="516" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Side panel UI</text><text x="74" y="536" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Chat interface · Knowledge library</text><text x="74" y="554" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Macros library · Graph visualizations</text></g><rect width="340" height="348" x="400" y="232" fill="none" stroke="#5DCAA5" stroke-dasharray="4 3" stroke-width=".8" rx="10"/><text x="412" y="250" fill="#9FE1CB" font-size="12" font-weight="600" text-anchor="start">Electron Shell (main process)</text><g><rect width="300" height="110" x="420" y="256" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="434" y="278" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Shell main</text><text x="434" y="298" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">BrowserViewManager · BrowserAgentIpc</text><text x="434" y="316" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">InlineBrowserControl</text><text x="434" y="334" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">CDP fingerprint masking</text></g><line x1="570" x2="570" y1="366" y2="390" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="300" height="92" x="420" y="390" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="434" y="412" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">WebContentsView tabs (per-tab renderer)</text><text x="434" y="432" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Content scripts</text><text x="434" y="450" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">WebAgent instances</text><text x="434" y="468" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Site agent activation</text></g></svg>