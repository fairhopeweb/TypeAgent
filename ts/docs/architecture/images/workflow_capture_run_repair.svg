<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 680 210"><title style="fill:#000;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Workflow lifecycle: capture, run, repair</title><desc style="fill:#000;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Three-stage workflow process where captured flows are executed via grammar matching and repaired in place when failures occur, with repaired flows re-registered back to the capture stage</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g style="fill:#000;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect width="184" height="120" x="40" y="36" stroke-width=".5" rx="8" style="fill:#3c3489;stroke:#afa9ec;color:#fff;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="132" y="60" dominant-baseline="central" text-anchor="middle" style="fill:#cecbf6;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">Capture</text><text x="132" y="86" dominant-baseline="central" text-anchor="middle" style="fill:#afa9ec;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Agent receives goal</text><text x="132" y="104" dominant-baseline="central" text-anchor="middle" style="fill:#afa9ec;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Writes domain API code</text><text x="132" y="122" dominant-baseline="central" text-anchor="middle" style="fill:#afa9ec;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Registers as action</text></g><line x1="224" x2="246" y1="96" y2="96" marker-end="url(#arrow)" style="fill:none;stroke:#9c9a92;color:#fff;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><g style="fill:#000;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect width="184" height="120" x="248" y="36" stroke-width=".5" rx="8" style="fill:#085041;stroke:#5dcaa5;color:#fff;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="60" dominant-baseline="central" text-anchor="middle" style="fill:#9fe1cb;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">Run</text><text x="340" y="86" dominant-baseline="central" text-anchor="middle" style="fill:#5dcaa5;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">User utterance</text><text x="340" y="100" dominant-baseline="central" text-anchor="middle" style="fill:#5dcaa5;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">↓</text><text x="340" y="114" dominant-baseline="central" text-anchor="middle" style="fill:#5dcaa5;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Grammar matching</text><text x="340" y="128" dominant-baseline="central" text-anchor="middle" style="fill:#5dcaa5;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">↓</text><text x="340" y="142" dominant-baseline="central" text-anchor="middle" style="fill:#5dcaa5;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Execute flow</text></g><line x1="432" x2="454" y1="96" y2="96" marker-end="url(#arrow)" style="fill:none;stroke:#9c9a92;color:#fff;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><g style="fill:#000;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect width="184" height="120" x="456" y="36" stroke-width=".5" rx="8" style="fill:#712b13;stroke:#f0997b;color:#fff;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="548" y="62" dominant-baseline="central" text-anchor="middle" style="fill:#f5c4b3;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">Repair</text><text x="548" y="90" dominant-baseline="central" text-anchor="middle" style="fill:#f0997b;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Agent re-writes flows</text><text x="548" y="108" dominant-baseline="central" text-anchor="middle" style="fill:#f0997b;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">if they fail in future</text><text x="548" y="126" dominant-baseline="central" text-anchor="middle" style="fill:#f0997b;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">invocation</text></g><path fill="none" stroke="#D85A30" stroke-dasharray="6 4" stroke-width="1" marker-end="url(#arrow-lg)" d="M548 156 L548 176 L132 176 L132 158" style="fill:none;stroke:#d85a30;color:#fff;stroke-width:1px;stroke-dasharray:6px,4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="192" dominant-baseline="central" text-anchor="middle" style="fill:#c2c0b6;stroke:none;color:#fff;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">Repaired flow re-registered</text></svg>