<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 640 420"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>BrowserReasoningAgent iterative reasoning loop</title><desc>A user goal drives the BrowserReasoningAgent, which runs an iterative loop that observes page state, reasons about the next action, executes it via the WebFlow browser API and checks whether the goal is achieved, recording each step in a BrowserReasoningTrace.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g><rect width="520" height="44" x="60" y="24" fill="#444441" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="320" y="46" fill="#D3D1C7" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">User goal: &quot;Find the cheapest flight from Seattle to NYC&quot;</text></g><line x1="320" x2="320" y1="68" y2="92" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="520" height="44" x="60" y="92" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="320" y="114" fill="#CECBF6" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">BrowserReasoningAgent (Anthropic Claude SDK)</text></g><line x1="320" x2="320" y1="136" y2="160" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><text x="410" y="148" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">iterative reasoning loop</text><rect width="520" height="170" x="60" y="160" fill="none" stroke="#AFA9EC" stroke-dasharray="4 3" stroke-width=".8" rx="10"/><text x="74" y="178" fill="#CECBF6" font-size="12" font-weight="600" text-anchor="start">Reasoning loop</text><text x="90" y="202" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">1. Observe current page state (HTML / screenshot)</text><text x="90" y="228" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">2. Reason about the next action to achieve the goal</text><text x="90" y="254" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">3. Execute action via WebFlowBrowserAPI</text><text x="90" y="280" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">4. Check if goal achieved, else continue</text><path fill="none" stroke="#D85A30" stroke-dasharray="6 4" stroke-width="1" marker-end="url(#arrow)" d="M560 312 L574 312 L574 180 L560 180"/><line x1="320" x2="320" y1="330" y2="354" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect width="520" height="44" x="60" y="354" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="320" y="376" fill="#9FE1CB" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">BrowserReasoningTrace (recorded steps for debugging / replay)</text></g></svg>