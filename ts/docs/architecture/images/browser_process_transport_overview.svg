<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 760 300"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>Browser agent: processes and transports</title><desc>The browser agent spans four processes connected by three transports: the Node.js browser agent talks to the extension service worker and Electron main process over WebSocket, the service worker reaches per-tab content scripts via chrome.tabs.sendMessage, and Electron main talks to per-tab WebContents over IPC.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g><rect width="170" height="64" x="30" y="40" fill="#444441" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="115" y="62" fill="#D3D1C7" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">Browser Agent</text><text x="115" y="82" fill="#B4B2A9" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="middle">(Node.js process)</text></g><g><rect width="170" height="64" x="300" y="40" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="385" y="62" fill="#CECBF6" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">Extension</text><text x="385" y="82" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="middle">Service Worker</text></g><g><rect width="170" height="64" x="560" y="40" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="645" y="62" fill="#CECBF6" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">Content Script</text><text x="645" y="82" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="middle">(per-tab / per-frame)</text></g><g><rect width="170" height="64" x="300" y="190" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="385" y="212" fill="#9FE1CB" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">Electron Main</text><text x="385" y="232" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="middle">(main process)</text></g><g><rect width="170" height="64" x="560" y="190" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="645" y="212" fill="#9FE1CB" dominant-baseline="central" font-size="14" font-weight="500" text-anchor="middle">WebContents</text><text x="645" y="232" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="middle">(per-tab renderer)</text></g><line x1="200" x2="300" y1="72" y2="72" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="250" y="60" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">WebSocket :8081</text><line x1="470" x2="560" y1="72" y2="72" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="515" y="52" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">chrome.tabs</text><text x="515" y="66" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">.sendMessage</text><path fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)" d="M115.0 104 L115.0 222.0 L300 222.0"/><text x="181" y="210" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">WebSocket :8081</text><line x1="470" x2="560" y1="222" y2="222" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="515" y="202" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">IPC</text><text x="515" y="216" fill="#C2C0B6" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="middle">(ipcMain/ipcRenderer)</text></svg>