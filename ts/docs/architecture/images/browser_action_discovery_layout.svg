<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 660 190"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>Action discovery component layout</title><desc>The content script captures HTML and a screenshot of an unfamiliar page and sends them to the browser agent&apos;s discovery subsystem, which translates the page into candidate actions via an LLM and registers them through its action handler and schema.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><g><rect width="260" height="106" x="40" y="40" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="62" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Content script</text><text x="54" y="82" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">HTML capture</text><text x="54" y="100" fill="#AFA9EC" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">Screenshot</text></g><g><rect width="260" height="106" x="360" y="40" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="374" y="62" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Browser agent — discovery/</text><text x="374" y="82" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">translator.mts (LLM)</text><text x="374" y="100" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">actionHandler.mts</text><text x="374" y="118" fill="#5DCAA5" dominant-baseline="central" font-size="12" font-weight="400" text-anchor="start">schema/ (action types)</text></g><line x1="300" x2="360" y1="93" y2="93" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/></svg>