<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 720 492"><style>text{font-family:&quot;Anthropic Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}</style><title>Browser agent state and storage tiers</title><desc>Five tiers of state persistence for the browser agent, from ephemeral in-memory maps lost on restart, through Chrome session and sync storage, to permanent file-system storage under the user data and per-agent instance directories.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><marker id="arrow-lg" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><line x1="360" x2="360" y1="130" y2="146" stroke="#C2C0B6" stroke-width="1" marker-end="url(#arrow)"/><line x1="360" x2="360" y1="202" y2="218" stroke="#C2C0B6" stroke-width="1" marker-end="url(#arrow)"/><line x1="360" x2="360" y1="292" y2="308" stroke="#C2C0B6" stroke-width="1" marker-end="url(#arrow)"/><line x1="360" x2="360" y1="400" y2="416" stroke="#C2C0B6" stroke-width="1" marker-end="url(#arrow)"/><g><rect width="640" height="110" x="40" y="20" fill="#712B13" stroke="#F0997B" stroke-width=".5" rx="8"/><text x="54" y="42" fill="#F5C4B3" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Tier 1 — In-memory (ephemeral, lost on process restart)</text><text x="54" y="62" fill="#F0997B" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Agent: extraction cache, retry counters, RPC maps</text><text x="54" y="80" fill="#F0997B" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Service worker: RPC map, navigation dedup, callbacks</text><text x="54" y="98" fill="#F0997B" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Content script: recording state, DOM element IDs</text><text x="54" y="116" fill="#F0997B" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Electron: BrowserViewManager tab map</text></g><g><rect width="640" height="56" x="40" y="146" fill="#712B13" stroke="#F0997B" stroke-width=".5" rx="8"/><text x="54" y="168" fill="#F5C4B3" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Tier 2 — Chrome storage session (survives SW restart)</text><text x="54" y="188" fill="#F0997B" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Recording state: actions, HTML, screenshots, index</text></g><g><rect width="640" height="74" x="40" y="218" fill="#3C3489" stroke="#AFA9EC" stroke-width=".5" rx="8"/><text x="54" y="240" fill="#CECBF6" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Tier 3 — Chrome storage sync / local (permanent, synced)</text><text x="54" y="260" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Settings: websocketHost, autoIndexing, extractionMode</text><text x="54" y="278" fill="#AFA9EC" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Search history</text></g><g><rect width="640" height="92" x="40" y="308" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="54" y="330" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Tier 4 — File system: user data (~/.typeagent/)</text><text x="54" y="350" fill="#5DCAA5" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Knowledge index: entity/topic graphs, website collection</text><text x="54" y="368" fill="#5DCAA5" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">WebFlow store: flow definitions, scripts, registry index</text><text x="54" y="386" fill="#5DCAA5" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Shell settings, PDF storage (annotations, URL mappings)</text></g><g><rect width="640" height="56" x="40" y="416" fill="#085041" stroke="#5DCAA5" stroke-width=".5" rx="8"/><text x="54" y="438" fill="#9FE1CB" dominant-baseline="central" font-size="13" font-weight="500" text-anchor="start">Tier 5 — File system: instance storage (agent context)</text><text x="54" y="458" fill="#5DCAA5" dominant-baseline="central" font-size="11" font-weight="400" text-anchor="start">Per-agent session data managed via agent SDK</text></g></svg>